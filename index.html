<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

.header{
    background:#1e293b;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
    border-bottom:1px solid #334155;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:#111827;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.chat{
    height:500px;
    overflow-y:auto;
    padding:20px;
}

.bot{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    width:fit-content;
    max-width:80%;
}

.user{
    background:#2563eb;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    margin-left:auto;
    width:fit-content;
    max-width:80%;
}

.bottom{
    display:flex;
    gap:10px;
    padding:20px;
    background:#0f172a;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="header">
🤖 BrightAI Assistant
</div>

<div class="container">

<div class="chat" id="chat">

<div class="bot">
👋 Hello! I am BrightAI.<br><br>
How can I help you today?
</div>

</div>

<div class="bottom">

<input
type="text"
id="message"
placeholder="Ask BrightAI anything...">

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

function sendMessage(){

const input=document.getElementById("message");
const chat=document.getElementById("chat");

if(input.value.trim()=="") return;

chat.innerHTML+=`
<div class="user">
${input.value}
</div>
`;

chat.innerHTML+=`
<div class="bot" id="typing">
🤖 BrightAI is thinking...
</div>
`;

chat.scrollTop=chat.scrollHeight;

setTimeout(function(){

document.getElementById("typing").innerHTML=
`🤖 Thanks for your message!<br><br>
I am still under development. Soon I will answer your questions using real Artificial Intelligence. 🚀`;

chat.scrollTop=chat.scrollHeight;

},1000);

input.value="";

}

document.getElementById("message").addEventListener("keypress",function(e){

if(e.key==="Enter"){
sendMessage();
}

});

</script>

</body>
</html>
