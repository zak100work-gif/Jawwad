function sendMessage(){

const input = document.getElementById("message");
const chat = document.getElementById("chat");

if(input.value.trim()==="") return;

chat.innerHTML += `
<div class="user">
${input.value}
</div>
`;

chat.innerHTML += `
<div class="bot" id="typing">
🤖 BrightAI is thinking...
</div>
`;

chat.scrollTop = chat.scrollHeight;

setTimeout(function(){

document.getElementById("typing").innerHTML =
`Hello! I am BrightAI.<br><br>
This is the first version of your AI chatbot. Soon I will be connected to a real AI model so I can answer your questions. 🚀`;

chat.scrollTop = chat.scrollHeight;

},1000);

input.value="";

}
</script>
