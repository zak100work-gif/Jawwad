<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrightAI Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#202123;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#171717;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:30px;
font-weight:bold;
color:#38bdf8;
text-align:center;
margin-bottom:30px;
}

.new-chat{
background:#10a37f;
color:white;
border:none;
padding:14px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-bottom:25px;
}

.new-chat:hover{
background:#0d8c6c;
}

.sidebar h3{
margin-bottom:15px;
color:#cbd5e1;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
background:#2b2c2f;
padding:12px;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

.sidebar li:hover{
background:#3a3b3f;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#2b2c2f;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:28px;
color:#38bdf8;
}

.home-btn{
text-decoration:none;
background:#2563eb;
color:white;
padding:10px 18px;
border-radius:8px;
}

.home-btn:hover{
background:#1d4ed8;
}

.chat{
flex:1;
padding:25px;
overflow-y:auto;
background:#202123;
}

.bot{

background:#444654;

padding:15px;

border-radius:12px;

margin-bottom:15px;

max-width:70%;

line-height:1.6;

}

.user{

background:#10a37f;

padding:15px;

border-radius:12px;

margin-left:auto;

margin-bottom:15px;

max-width:70%;

line-height:1.6;

}

.bottom{

display:flex;

padding:20px;

background:#2b2c2f;

}

.bottom input{

flex:1;

padding:16px;

border:none;

border-radius:10px;

font-size:16px;

outline:none;

}

.bottom button{

margin-left:10px;

padding:16px 30px;

background:#10a37f;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

}

.bottom button:hover{

background:#0d8c6c;

}

</style>

</head>

<body>
<div class="sidebar">

<div class="logo">
🤖 BrightAI
</div>

<button class="new-chat" onclick="newChat()">
➕ New Chat
</button>

<h3>Recent Chats</h3>

<ul>
<li>💬 Python Help</li>
<li>💬 HTML Project</li>
<li>💬 AI Questions</li>
</ul>

</div>

<div class="main">

<div class="header">

<h1>BrightAI Chat</h1>

<a href="index.html" class="home-btn">
🏠 Home
</a>

</div>

<div class="chat" id="chat">

<div class="bot">
👋 Hello! I am <b>BrightAI</b>.<br><br>

Ask me anything and I'll do my best to help you.
</div>

</div>

<div class="bottom">

<input
type="text"
id="message"
placeholder="Message BrightAI..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>
<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");

function sendMessage(){

const message = input.value.trim();

if(message==="") return;

chat.innerHTML += `
<div class="user">
${message}
</div>
`;

input.value="";

chat.scrollTop = chat.scrollHeight;

setTimeout(function(){

let reply = "I'm still learning. Soon I'll be connected to a real AI model!";

const text = message.toLowerCase();

if(text.includes("hello") || text.includes("hi")){
reply="👋 Hello! How can I help you today?";
}
else if(text.includes("your name")){
reply="My name is BrightAI.";
}
else if(text.includes("python")){
reply="Python is one of the best programming languages for AI and web development.";
}
else if(text.includes("html")){
reply="HTML is used to create the structure of web pages.";
}
else if(text.includes("css")){
reply="CSS makes websites beautiful by controlling colors, layouts, and fonts.";
}

chat.innerHTML += `
<div class="bot">
${reply}
</div>
`;

chat.scrollTop = chat.scrollHeight;

},700);

}

input.addEventListener("keypress",function(event){

if(event.key==="Enter"){
sendMessage();
}

});

function newChat(){

chat.innerHTML = `
<div class="bot">
👋 Hello! I am <b>BrightAI</b>.<br><br>
How can I help you today?
</div>
`;

input.value="";

}

</script>

</body>

</html
