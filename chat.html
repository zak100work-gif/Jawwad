<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightAI Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#202123;
color:white;
display:flex;
height:100vh;
}

.sidebar{
width:260px;
background:#171717;
padding:20px;
}

.sidebar h2{
margin-bottom:20px;
color:#38bdf8;
}

.sidebar button{
width:100%;
padding:12px;
border:none;
background:#10a37f;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-bottom:20px;
}

.sidebar button:hover{
background:#0d8c6c;
}

.sidebar h3{
margin-bottom:10px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:10px;
margin-bottom:8px;
background:#2b2c2f;
border-radius:6px;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#2b2c2f;
padding:20px;
font-size:24px;
font-weight:bold;
color:#38bdf8;
}

.chat{
flex:1;
padding:20px;
overflow-y:auto;
}

.bot{
background:#444654;
padding:15px;
border-radius:10px;
margin-bottom:15px;
max-width:70%;
}

.user{
background:#10a37f;
padding:15px;
border-radius:10px;
margin-left:auto;
margin-bottom:15px;
max-width:70%;
}

.bottom{
display:flex;
padding:20px;
background:#2b2c2f;
}

.bottom input{
flex:1;
padding:15px;
font-size:16px;
border:none;
border-radius:8px;
outline:none;
}

.bottom button{
margin-left:10px;
padding:15px 25px;
background:#10a37f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.bottom button:hover{
background:#0d8c6c;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>🤖 BrightAI</h2>

<button>➕ New Chat</button>

<h3>Recent Chats</h3>

<ul>
<li>Python Help</li>
<li>HTML Project</li>
<li>AI Questions</li>
</ul>

</div>

<div class="main">

<div class="header">
🤖 BrightAI Chat
</div>

<div class="chat">

<div class="bot">
👋 Hello! I am BrightAI.<br><br>
How can I help you today?
</div>

</div>

<div class="bottom">

<input
type="text"
placeholder="Ask BrightAI anything..."
>

<button>
Send
</button>

</div>

</div>

</body>
</html>
