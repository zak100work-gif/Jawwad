<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrightAI Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#202123;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:250px;
background:#171717;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:80px;
height:80px;
border-radius:15px;
}

.new-chat{
background:#10a37f;
color:white;
border:none;
padding:12px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-bottom:25px;
}

.new-chat:hover{
background:#0d8c6c;
}

.sidebar h3{
margin-bottom:10px;
font-size:18px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:10px 0;
color:#d1d5db;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#2b2d31;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#38bdf8;
}

.home-btn{
background:#2563eb;
color:white;
text-decoration:none;
padding:10px 18px;
border-radius:8px;
}

</style>

</head>

<body>
<div class="sidebar">

    <div class="logo">
        <img src="Screenshot 2026-07-30 120743.png" alt="BrightAI Logo">
    </div>

    <button class="new-chat" onclick="newChat()">
        ➕ New Chat
    </button>

    <h3>Recent Chats</h3>

    <ul>
        <li>💬 Python Help</li>
        <li>💬 HTML Project</li>
        <li>💬 AI Questions</li>
    </ul>

</div>

<div class="main">

    <div class="header">

        <h1>BrightAI Chat</h1>

        <a href="index.html" class="home-btn">
            🏠 Home
        </a>

    </div>
    <div id="chat"
style="
flex:1;
padding:30px;
overflow-y:auto;
background:#202123;
">

<div class="bot"
style="
background:#343541;
padding:18px;
border-radius:12px;
max-width:700px;
margin-bottom:20px;
">

👋 <b>Hello! I am BrightAI.</b>

<br><br>

Welcome to BrightAI. Ask me anything about programming, AI, websites, or technology.

</div>

</div>

<div
style="
display:flex;
padding:20px;
background:#2b2d31;
">

<input
id="message"
type="text"
placeholder="Type your message..."
style="
flex:1;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
">

<button
onclick="sendMessage()"
style="
margin-left:10px;
padding:15px 25px;
background:#10a37f;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
">

Send

</button>

</div>
<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");

function sendMessage(){

const message = input.value.trim();

if(message==="") return;

chat.innerHTML += `
<div style="
background:#10a37f;
padding:15px;
border-radius:12px;
max-width:700px;
margin-left:auto;
margin-bottom:20px;
">
${message}
</div>
`;

input.value="";

chat.scrollTop=chat.scrollHeight;

chat.innerHTML += `
<div id="typing" style="
background:#343541;
padding:15px;
border-radius:12px;
max-width:700px;
margin-bottom:20px;
">
🤖 BrightAI is typing...
</div>
`;

chat.scrollTop=chat.scrollHeight;

setTimeout(function(){

const typing=document.getElementById("typing");

if(typing){
typing.remove();
}

chat.innerHTML += `
<div style="
background:#343541;
padding:15px;
border-radius:12px;
max-width:700px;
margin-bottom:20px;
">
Thanks for your message! 😊<br><br>
I'm BrightAI. Soon I'll answer your questions using a real AI model.
</div>
`;

chat.scrollTop=chat.scrollHeight;

},1500);

}

input.addEventListener("keypress",function(event){

if(event.key==="Enter"){
sendMessage();
}

});

</script>
<script>

function newChat(){

chat.innerHTML = `
<div style="
background:#343541;
padding:18px;
border-radius:12px;
max-width:700px;
margin-bottom:20px;
">

👋 <b>Hello! I am BrightAI.</b>

<br><br>

Welcome to BrightAI.

Start a new conversation by typing your message below.

</div>
`;

input.value="";

}

</script>

</body>

</html>
<style>

/* Better scrollbar */
#chat::-webkit-scrollbar{
width:8px;
}

#chat::-webkit-scrollbar-thumb{
background:#555;
border-radius:10px;
}

/* Better hover effect */
.sidebar li{
padding:12px;
border-radius:8px;
transition:0.3s;
}

.sidebar li:hover{
background:#2f3136;
cursor:pointer;
}

/* Logo animation */
.logo img{
transition:0.3s;
}

.logo img:hover{
transform:scale(1.08);
}

/* Better Send button */
button{
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

</style>
